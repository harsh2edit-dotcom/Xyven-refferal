<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XYVEN Referral — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<canvas id="grid-canvas"></canvas>

<div class="lang-bar">
  <select id="lang" class="lang-select">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="hg">Hinglish</option>
  </select>
</div>

<div class="center-screen">
  <div class="auth-wrap">
    <div class="brand-hero">
      <div class="brand-mark" aria-hidden="true"><i data-lucide="zap"></i></div>
      <h1 class="gradient-text">XYVEN Referral</h1>
      <p class="muted" data-i18n="tagline">Earn by inviting genuine new members.</p>
    </div>

    <div class="glass auth-card">
      <div class="tabs">
        <button class="tab active" data-tab="login" data-i18n="signIn">Sign In</button>
        <button class="tab" data-tab="signup" data-i18n="signUp">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <form id="login-form" class="tab-panel active" autocomplete="on">
        <div class="field">
          <label data-i18n="username">Username or Email</label>
          <input class="input" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label data-i18n="password">Password</label>
          <div class="input-group">
            <input class="input" type="password" name="password" autocomplete="current-password" required>
            <button type="button" class="trail" data-toggle="password"><i data-lucide="eye"></i></button>
          </div>
        </div>
        <button class="btn btn-block" type="submit">
          <i data-lucide="log-in"></i><span data-i18n="signIn">Sign In</span>
        </button>
        <p class="hint center muted" style="margin-top:14px" data-i18n="noAccount">New here? Create an account.</p>
      </form>

      <!-- SIGNUP -->
      <form id="signup-form" class="tab-panel" autocomplete="on">
        <div class="field">
          <label data-i18n="fullName">Full Name</label>
          <input class="input" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label data-i18n="username">Username</label>
          <input class="input" name="username" autocomplete="username" required>
        </div>
        <div class="field">
          <label data-i18n="email">Gmail / Email</label>
          <input class="input" type="email" name="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label data-i18n="password">Password</label>
          <div class="input-group">
            <input class="input" type="password" name="password" autocomplete="new-password" required>
            <button type="button" class="trail" data-toggle="password"><i data-lucide="eye"></i></button>
          </div>
          <p class="hint" data-i18n="passHint">Min 8 chars, with uppercase, lowercase and number.</p>
        </div>
        <div class="field">
          <label data-i18n="refCode">Referral Code (optional)</label>
          <input class="input" name="referralCode" placeholder="XYVXXXXX" style="text-transform:uppercase">
        </div>
        <button class="btn btn-block" type="submit">
          <i data-lucide="user-plus"></i><span data-i18n="createAccount">Create Account</span>
        </button>
      </form>
    </div>

    <p class="tiny center faint" style="margin-top:22px">
      By continuing you agree to platform rules and verification.
    </p>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<script src="/assets/app.js" defer></script>
</body>
</html>
