<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XYVEN Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>
<canvas id="grid-canvas"></canvas>

<!-- LOGIN -->
<div id="admin-login" class="center-screen">
  <div class="glass auth-card" style="max-width:420px;width:100%">
    <div class="brand" style="justify-content:center;margin-bottom:20px">
      <div class="brand-mark"><i data-lucide="shield-check"></i></div>
      <span class="gradient-text">XYVEN Admin</span>
    </div>
    <form id="admin-login-form">
      <div class="field">
        <label>Username</label>
        <input class="input" name="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" type="password" name="password" required>
      </div>
      <button class="btn btn-block" type="submit"><i data-lucide="lock"></i>Sign In</button>
    </form>
  </div>
</div>

<!-- PANEL -->
<div id="admin-panel" style="display:none">
  <header class="topbar">
    <div class="container">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="shield-check"></i></div>
        <span class="gradient-text">Admin Console</span>
      </div>
      <div class="spacer"></div>
      <button class="icon-btn" id="admin-logout" aria-label="Logout"><i data-lucide="log-out"></i></button>
    </div>
  </header>

  <div class="container admin-layout">
    <aside class="admin-side">
      <button class="side-item active" data-tab="overview"><i data-lucide="bar-chart-3"></i>Overview</button>
      <button class="side-item" data-tab="users"><i data-lucide="users"></i>Users</button>
      <button class="side-item" data-tab="withdrawals"><i data-lucide="banknote"></i>Withdrawals</button>
      <button class="side-item" data-tab="deposits"><i data-lucide="arrow-down-circle"></i>Deposits</button>
      <button class="side-item" data-tab="coupons"><i data-lucide="ticket"></i>Coupons</button>
      <button class="side-item" data-tab="notifications"><i data-lucide="bell"></i>Notifications</button>
      <button class="side-item" data-tab="transactions"><i data-lucide="list"></i>Transactions</button>
      <button class="side-item" data-tab="audit"><i data-lucide="scroll-text"></i>Audit Log</button>
    </aside>

    <main class="admin-main">
      <section class="admin-tab active" id="tab-overview">
        <h2 class="gradient-text">Overview</h2>
        <div class="grid-cards mt-14" id="admin-stats"></div>
      </section>

      <section class="admin-tab" id="tab-users">
        <div class="page-head">
          <h2 class="gradient-text">Users</h2>
          <input class="input" id="user-search" placeholder="Search username, email, code" style="max-width:300px">
        </div>
        <div class="glass card mt-14"><div id="admin-users" class="table-wrap"></div></div>
      </section>

      <section class="admin-tab" id="tab-withdrawals">
        <h2 class="gradient-text">Withdrawals</h2>
        <div class="glass card mt-14"><div id="admin-wds" class="table-wrap"></div></div>
      </section>

      <section class="admin-tab" id="tab-deposits">
        <h2 class="gradient-text">Deposits</h2>
        <div class="glass card mt-14"><div id="admin-deps" class="table-wrap"></div></div>
      </section>

      <section class="admin-tab" id="tab-coupons">
        <div class="page-head">
          <h2 class="gradient-text">Coupons</h2>
          <button class="btn btn-sm" id="new-coupon"><i data-lucide="plus"></i>New Coupon</button>
        </div>
        <div class="glass card mt-14"><div id="admin-coupons" class="table-wrap"></div></div>
      </section>

      <section class="admin-tab" id="tab-notifications">
        <h2 class="gradient-text">Broadcast Notification</h2>
        <div class="glass card mt-14">
          <form id="broadcast-form">
            <div class="field">
              <label>Audience</label>
              <select class="input" name="audience">
                <option value="all">All users</option>
                <option value="single">Single user</option>
              </select>
            </div>
            <div class="field" id="single-user-wrap" style="display:none">
              <label>User ID</label>
              <input class="input" name="userId" type="number" placeholder="User ID">
            </div>
            <div class="field">
              <label>Title</label>
              <input class="input" name="title" required maxlength="120">
            </div>
            <div class="field">
              <label>Message</label>
              <textarea class="input" name="body" required maxlength="1000"></textarea>
            </div>
            <button class="btn" type="submit"><i data-lucide="send"></i>Send</button>
          </form>
        </div>
      </section>

      <section class="admin-tab" id="tab-transactions">
        <h2 class="gradient-text">Transactions</h2>
        <div class="glass card mt-14"><div id="admin-txns" class="table-wrap"></div></div>
      </section>

      <section class="admin-tab" id="tab-audit">
        <h2 class="gradient-text">Audit Log</h2>
        <div class="glass card mt-14"><div id="admin-audit" class="table-wrap"></div></div>
      </section>
    </main>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>
<div id="modal-root"></div>

<script src="/assets/app.js" defer></script>
</body>
</html>
